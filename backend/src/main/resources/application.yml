spring:
  application:
    name: skillforge-backend

  # Render env vars: DB_URL, DB_USERNAME, DB_PASSWORD (mapped in DatabaseUrlEnvironmentPostProcessor)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: ${JWT_SECRET:SF-DEFAULT-JWT-SECRET-KEY-2026-MUST-BE-AT-LEAST-256-BITS-LONG}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7
  refresh-token-expiry-seconds: ${REFRESH_TOKEN_EXPIRY_SECONDS:604800}

admin:
  provisioning:
    secret: ${ADMIN_PROVISIONING_SECRET:SF-PROV-SEC-2026-ADMIN-KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs