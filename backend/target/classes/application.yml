spring:
  application:
    name: skillforge-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}          # e.g. jdbc:postgresql://<supabase-host>:5432/postgres
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: create-drop      # use create-drop for in‑memory DB during dev
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:testsecret}        # HS256 signing secret - default for dev
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
